<!DOCTYPE html>
<html>

<head>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.equinetransportuk.com/" />
  <title>Secure Outstanding Payment | Equine Transport UK</title>
    <script>
      try {
        if (localStorage.getItem("equine-theme") === "dark") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (_) {}
    </script>
      <script src="theme.js?v=live-light-dark-v2" defer></script>
  
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #1d2530; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h2 { margin: 0; padding: 24px; text-align: center; }
      html.theme-dark { color-scheme: dark; }
      html.theme-dark body { background: #07111d; color: #f3f7fb; }
    </style>
  </head>

<body>
  <h2>Redirecting to payment...</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get("bookingId");

    if (!bookingId) {
      document.body.innerHTML = "<h2>Invalid booking link</h2>";
    } else {

      fetch(`https://equine-bookings-api.kverhagen.workers.dev/api/outstanding-session?bookingId=${bookingId}`)
        .then(res => res.json())
        .then(data => {

          if (data.url) {
            window.location.href = data.url;
          } else {
            document.body.innerHTML = "<h2>Payment error</h2>";
          }

        })
        .catch(() => {
          document.body.innerHTML = "<h2>Connection error</h2>";
        });

    }
  </script>

</body>

</html>
